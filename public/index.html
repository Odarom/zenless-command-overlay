<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커맨드 오버레이 v1</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><span class="brand-mark">≋</span><strong data-i18n="app"></strong><span class="version">v1.3</span></div><nav><button id="new" data-i18n="newProject"></button><button id="open-project" data-i18n="openProject"></button><button id="save-project" data-i18n="saveProject"></button><label class="language-control"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5.2 7.5h13.6M5.2 16.5h13.6"/></svg><select id="language" data-label="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">简体中文</option></select></label></nav></header>
<div id="message" role="status" aria-live="polite"></div>
<main>
 <section class="workspace">
  <div class="source-bar"><button id="open-video" class="primary" data-i18n="openVideo"></button><span id="video-name"></span><span id="save-state" class="muted"></span></div>
  <div id="stage" class="stage"><video id="video" preload="auto" playsinline></video><canvas id="overlay"></canvas><div id="empty"><strong data-i18n="emptyVideo"></strong><span data-i18n="emptySub"></span></div></div>
  <div id="proxy-box" hidden><span id="proxy-error" data-i18n="proxyHint" hidden></span> <button id="proxy" data-i18n="proxy"></button><button id="original" data-i18n="original" hidden></button></div>
  <div class="transport"><button id="play" data-i18n="play"></button><button id="prev">−1F</button><button id="next">+1F</button><output id="time">00:00:00</output><select id="speed" data-label="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><div class="volume-control"><button id="mute" type="button" aria-pressed="false" data-i18n="mute"></button><input id="volume" type="range" min="0" max="100" step="1" value="60" data-label="volume"><output id="volume-value" for="volume">60%</output></div><button id="record" aria-pressed="true" class="record" data-i18n="recordOn"></button><button id="undo" data-i18n="undo"></button><button id="redo" data-i18n="redo"></button></div>
  <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Timeline"><canvas id="timeline" height="36"></canvas>
  <div class="party-line"><strong data-i18n="party"></strong><div id="party-slots"></div><select id="party-presets" data-label="loadParty"></select><button id="save-party" data-i18n="saveParty"></button><button id="delete-party" data-i18n="deleteParty"></button><button id="add-portrait" data-i18n="addPortrait"></button></div>
  <div id="command-keys"></div><div class="muted help" data-i18n="recordHint"></div>
  <details id="settings"><summary data-i18n="settings"></summary><div class="setting-grid">
   <label><span data-i18n="x"></span><input data-style="x" type="range" min="0" max="80" step=".5"></label>
   <label><span data-i18n="y"></span><input data-style="y" type="range" min="10" max="85" step=".5"></label>
   <label><span data-i18n="scale"></span><input data-style="scale" type="range" min="40" max="200" step="5"></label>
   <label><span data-i18n="background"></span><input data-style="background" type="range" min="0" max="100" step="5"></label>
   <label><span data-i18n="holdColor"></span><input data-style="holdColor" type="color"></label>
   <label><span data-i18n="fps"></span><select id="fps"><option value="60/1">60</option><option value="60000/1001">59.94</option><option value="50/1">50</option><option value="30/1">30</option><option value="30000/1001">29.97</option><option value="25/1">25</option><option value="24/1">24</option><option value="24000/1001">23.976</option></select></label>
   <label><span data-i18n="holdThreshold"></span><input id="hold-threshold" type="number" min="100" max="2000" step="10"></label>
   <label class="check"><input id="animation" type="checkbox" checked><span data-i18n="animation"></span></label>
   <label><span data-i18n="transitionMs"></span><input id="transition-ms" type="number" min="0" max="500" step="10" value="180"></label>
  </div><div class="record-options"><label><span data-i18n="recordSwitchVariant"></span><select id="record-switch-variant"><option value="white" data-i18n="white"></option><option value="yellow" data-i18n="yellow"></option></select></label><button id="clear-previews" data-i18n="clearPreviews"></button></div><div id="key-settings" class="setting-grid"></div><p class="muted" data-i18n="specialNote"></p></details>
 </section>
 <aside>
  <section class="editor"><h2 data-i18n="edit"></h2><div id="selection-summary" class="muted"></div><div id="group-picks"></div><button id="go-selected" data-i18n="go"></button><label id="switch-variant-label" hidden><span data-i18n="switchVariant"></span><select id="switch-variant"><option value="white" data-i18n="white"></option><option value="yellow" data-i18n="yellow"></option></select></label><label><span data-i18n="connector"></span><select id="connector"><option value="arrow" data-i18n="arrow"></option><option value="plus" data-i18n="plus"></option></select></label><label><span data-i18n="note"></span><input id="note" type="text" maxlength="160" data-placeholder="notePlaceholder"></label><label class="check"><input id="hold" type="checkbox"><span data-i18n="hold"></span></label><div class="two"><label><span data-i18n="frame"></span><input id="event-frame" type="number" min="0" step="1"></label><label><span data-i18n="endFrame"></span><input id="event-end" type="number" min="0" step="1"></label></div><p class="muted" data-i18n="groupHint"></p><button id="split" data-i18n="split"></button><small id="split-hint"></small><div class="two"><button id="merge" data-i18n="merge"></button><button id="delete" class="danger" data-i18n="delete"></button></div></section>
  <section class="events"><h2><span data-i18n="events"></span><span id="event-count" class="muted"></span></h2><div id="event-list"></div></section>
 </aside>
</main>
<section class="export-panel"><div><h2 data-i18n="export"></h2><p class="muted" data-i18n="exportHint"></p></div><label class="check"><input id="crop" type="checkbox" checked><span data-i18n="crop"></span></label><select id="format" data-label="format"><option value="mov" data-i18n="mov"></option><option value="png" data-i18n="png"></option></select><button id="export" class="primary" data-i18n="export"></button><div id="export-state" aria-live="polite"></div><progress id="export-progress" max="100" value="0" hidden></progress><button id="cancel-export" data-i18n="cancel" hidden></button><a id="download-export" class="button" data-i18n="download" hidden></a><button id="open-output" data-i18n="openOutput" hidden></button></section>
<footer><span data-i18n="privacy"></span><span id="tools-state"></span><button id="check-update" data-i18n="checkUpdate"></button></footer>
<dialog id="update-dialog"><h2 data-i18n="checkUpdate"></h2><p id="update-status" aria-live="polite"></p><a id="release-link" class="button" target="_blank" rel="noopener noreferrer" data-i18n="releasePage" hidden></a><div class="two"><button id="close-update" data-i18n="cancel"></button><button id="install-update" class="primary" data-i18n="installUpdate" hidden></button></div></dialog>
<dialog id="portrait-dialog"><form id="portrait-form"><h2 data-i18n="addPortrait"></h2><label><span data-i18n="name"></span><input id="portrait-name" maxlength="100" required></label><label><span data-i18n="portrait"></span><input id="portrait-file" type="file" accept="image/png,image/webp,image/jpeg" required></label><div class="two"><button type="button" id="close-portrait" data-i18n="cancel"></button><button type="submit" class="primary" data-i18n="add"></button></div></form></dialog>
<input id="project-file" type="file" accept=".json,.zzzoverlay" hidden>
<script type="module" src="/app.mjs"></script>
</body></html>
